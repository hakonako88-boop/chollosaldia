<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Abriendo oferta | Chollos al Día</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0b1220;color:white;text-align:center;padding:24px}.box{max-width:520px;background:#111827;border:1px solid #344054;border-radius:24px;padding:28px}.btn{display:inline-block;margin-top:18px;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,#ffb000,#ff7a00);color:#111;font-weight:900;text-decoration:none}</style></head><body><div class="box"><h1>Abriendo oferta…</h1><p>Intentando abrir la app de la tienda.</p><a class="btn" id="open" href="https://t.me/aldiachollos">Ver oferta</a></div><script>const params=new URLSearchParams(location.search||location.hash.replace(/^#/,'?'));const directUrl=params.get('url')||params.get('u')||'https://t.me/aldiachollos';function appIntentForUrl(input){try{const p=new URL(input);const h=p.hostname.replace(/^www\./i,'').toLowerCase();let pkg='';if(h==='amzn.to'||h.endsWith('amazon.es')||h.endsWith('amazon.com'))pkg='com.amazon.mShop.android.shopping';if(h==='s.click.aliexpress.com'||h==='a.aliexpress.com'||h.endsWith('aliexpress.com'))pkg='com.alibaba.aliexpresshd';if(!pkg)return input;return 'intent://'+p.host+p.pathname+p.search+'#Intent;scheme=https;package='+pkg+';S.browser_fallback_url='+encodeURIComponent(input)+';end'}catch{return input}}const appUrl=appIntentForUrl(directUrl);const open=document.getElementById('open');open.href=appUrl;window.location.href=appUrl;setTimeout(()=>{open.href=directUrl},1800);</script></body></html>
